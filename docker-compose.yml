# WealthPilot — 一键启动前后端
# 用法: docker compose up --build
# 前端: http://localhost:5173
# 后端: http://localhost:8000/docs

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: wealthpilot-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    volumes:
      - wealthpilot-data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: wealthpilot-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  wealthpilot-data:
