name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: workbench/package-lock.json
      - run: npm ci
        working-directory: workbench
      # Pages 上没有后端：构建成演示模式，回放录好的真实结果（workbench/src/demo）
      - run: npm run build
        working-directory: workbench
        env:
          VITE_DEMO: "1"
          WP_BASE: /wealthpilot/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: workbench/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
