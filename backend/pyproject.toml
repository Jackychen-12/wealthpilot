[project]
name = "wealthpilot"
version = "0.6.0"
description = "WealthPilot AI Agent Backend — portfolio analysis, market data, LLM chat"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "anthropic>=0.40.0",
    "openai>=1.40.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.1",
    "sqlmodel>=0.0.22",
    "akshare>=1.14.0",
    "bcrypt>=4.0.0",
    "python-multipart>=0.0.9",
    "openpyxl>=3.1.0",
    "pyjwt>=2.9.0",
    "mcp[cli]>=2.0.0,<3",
    "reportlab>=5.0.1",
    "rich>=13.7.0",
    "prompt-toolkit>=3.0.43",
    "pypdf>=5.0.0",
    "pyyaml>=6.0",
    "cryptography>=42",      # 企业微信回调的 AES 加解密
]

[project.scripts]
wealthpilot = "wealthpilot.__main__:main"

[project.optional-dependencies]
# 在飞书里和它对话（长连接，不需要公网地址）。不用飞书可以不装
feishu = ["lark-oapi>=1.4.0"]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wealthpilot"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM"]
ignore = ["E501", "B008"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
