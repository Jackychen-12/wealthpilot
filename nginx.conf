server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location /wealthpilot/ {
        try_files $uri $uri/ /wealthpilot/index.html;
    }

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;
    }
}
